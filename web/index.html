<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Ein gemeinsames, unendliches Whiteboard für Mensch und Browser-Agent.">
  <title>Shared Whiteboard</title>
  <link rel="stylesheet" href="./app.css?v=0.15.0">
</head>
<body>
  <main class="workspace" aria-label="Gemeinsames unendliches Whiteboard">
    <canvas id="board" data-active-tool="pen" aria-label="Unendliche Zeichenfläche"></canvas>
    <nav class="toolbar" aria-label="Whiteboard-Werkzeuge">
      <div class="primary-tools">
        <button type="button" data-tool="pen" aria-label="Freihand" title="Freihand · P"></button>
        <button type="button" data-tool="ai-pen" class="ai-tool" aria-label="AI Pen" title="AI Pen · I"></button>
        <button type="button" data-tool="marker" aria-label="Marker" title="Marker · M"></button>
        <button type="button" data-tool="eraser" aria-label="Radierer" title="Pixel-Radierer · E"></button>
        <button type="button" data-tool="select" aria-label="Auswählen" title="Auswählen · V"></button>
        <button type="button" data-tool="text" aria-label="Textfeld" title="Textfeld · T"></button>
      </div>
      <div class="toolbar-divider"></div>
      <button type="button" id="shapes-toggle" aria-label="Formen" title="Formen"></button>
      <button type="button" id="content-toggle" aria-label="Inhalte" title="Inhalte"></button>
      <button type="button" id="color-picker-toggle" class="color-picker-toggle" aria-label="Farbe" title="Farbe"><span></span></button>
      <div class="toolbar-divider secondary-divider"></div>
      <button type="button" id="undo" class="secondary-action" aria-label="Rückgängig" title="Rückgängig"></button>
      <button type="button" id="redo" class="secondary-action" aria-label="Wiederholen" title="Wiederholen"></button>
      <label class="instruction-control"><span>Anweisung</span><textarea id="instruction-prompt" rows="1" maxlength="4000" aria-label="Anweisung an den Agenten"></textarea></label>
      <button type="button" id="submit-turn" class="submit-arrow" aria-label="Notiz an Agent senden" title="An Agent senden · Strg+Enter"></button>
    </nav>
    <section id="shapes-popover" class="popover tool-popover" hidden aria-label="Formen">
      <button type="button" data-tool="rectangle" aria-label="Rechteck"></button>
      <button type="button" data-tool="ellipse" aria-label="Ellipse"></button>
      <button type="button" data-tool="arrow" aria-label="Pfeil"></button>
      <button type="button" data-tool="select" aria-label="Auswählen"></button>
      <button type="button" data-tool="lasso" aria-label="Lasso"></button>
      <button type="button" data-tool="hand" aria-label="Canvas verschieben"></button>
    </section>
    <section id="content-popover" class="popover content-popover" hidden aria-label="Inhalte">
      <button type="button" data-tool="sticky" aria-label="Notizzettel"><span>Notiz</span></button>
      <button type="button" id="image-tool" data-tool="image" aria-label="Bild"><span>Bild</span></button>
      <button type="button" data-tool="artboard" aria-label="Artboard"><span>Artboard</span></button>
      <div class="popover-rule"></div>
      <button type="button" data-ui-template="button"><span>Button</span></button>
      <button type="button" data-ui-template="input"><span>Textfeld</span></button>
      <button type="button" data-ui-template="card"><span>Card</span></button>
      <button type="button" data-ui-template="switch"><span>Switch</span></button>
      <button type="button" data-ui-template="tabs"><span>Tabs</span></button>
    </section>
    <section id="color-popover" class="popover color-popover" hidden>
      <div class="swatches" aria-label="Schnellfarben">
        <button type="button" data-color="#080808" class="color is-active" aria-label="Schwarz"></button><button type="button" data-color="#2457e6" class="color" aria-label="Blau"></button><button type="button" data-color="#c62828" class="color" aria-label="Rot"></button><button type="button" data-color="#16833b" class="color" aria-label="Grün"></button><button type="button" data-color="#7c3aed" class="color" aria-label="Violett"></button>
      </div>
      <label>Farbe <input id="color-native" type="color" value="#080808"></label>
      <label>Hex <input id="color-hex" type="text" value="#080808" maxlength="7" spellcheck="false"></label>
      <label>Deckkraft <input id="color-opacity" type="range" min="10" max="100" value="100"></label>
    </section>
    <section class="utility" aria-label="Ansicht und Datei">
      <button type="button" id="fit" aria-label="Alles einpassen" title="Alles einpassen"></button><span id="zoom">100%</span><span id="revision">r0</span>
      <button type="button" id="export-toggle" aria-label="Export" title="Export">Export</button>
      <label class="file-label">Import<input id="import-json" type="file" accept="application/json"></label>
      <button type="button" id="settings-toggle" aria-label="Einstellungen" title="Einstellungen"></button><button type="button" id="clear" aria-label="Whiteboard leeren" title="Whiteboard leeren"></button>
    </section>
    <section id="export-popover" class="popover export-popover" hidden><strong>Export</strong><button type="button" data-export="png">PNG · 2×</button><button type="button" data-export="svg">SVG · Vektor</button><button type="button" data-export="pdf">PDF · Artboards</button><button type="button" data-export="json">JSON · Editierbar</button><small>AI Pen, Agent Marker und Vorschlagskonturen werden nicht exportiert.</small></section>
    <section id="settings-popover" class="popover settings-popover" hidden>
      <h2>Schreibwerkzeuge</h2><label><input id="setting-smoothing" type="checkbox"> Sanfte Eingabeglättung</label><label><input id="setting-pressure" type="checkbox"> Stiftdruck</label><label><input id="setting-auto-shape" type="checkbox"> Formen verbessern</label><label><input id="setting-smart-highlight" type="checkbox"> Marker an Inhalt ausrichten</label><label><input id="setting-english-assist" type="checkbox"> Englische Handschrift für Agent lesbar machen</label><p id="handwriting-support">Lokal im Browser, ohne sichtbaren Textaustausch.</p>
    </section>
    <section id="selection-tools" class="selection-tools" aria-label="Auswahl bearbeiten" hidden>
      <button type="button" id="duplicate" aria-label="Auswahl duplizieren"></button><button type="button" id="send-back" aria-label="In den Hintergrund"></button><button type="button" id="bring-front" aria-label="In den Vordergrund"></button>
      <span class="text-actions"><button type="button" id="edit-text" aria-label="Textfeld bearbeiten"></button><button type="button" id="text-smaller" aria-label="Text verkleinern"></button><button type="button" id="text-larger" aria-label="Text vergrößern"></button></span>
      <button type="button" id="attach-agent" class="attach-action" aria-label="Für Agent vormerken"></button><button type="button" id="delete-selection" aria-label="Auswahl löschen"></button>
    </section>
    <section id="review" class="review" aria-label="Agentenvorschlag prüfen" hidden><span>Vorschlag prüfen</span><button type="button" id="accept"></button><button type="button" id="undo-agent"></button></section>
    <section id="explanation-controls" class="explanation-controls" aria-label="Geführte Erklärung" hidden><button type="button" id="explanation-prev" aria-label="Vorheriger Schritt">‹</button><button type="button" id="explanation-overview">Übersicht</button><span id="explanation-title"></span><button type="button" id="explanation-next" aria-label="Nächster Schritt">›</button></section>
    <div class="activity" role="status" aria-live="polite"><span id="status"></span><span id="request-scope">Gesamte Notiz</span></div>
    <div id="agent-marker-tip" class="agent-marker-tip" role="tooltip" hidden><span></span>Agentenkommentar · temporär · nicht im Export</div>
    <input id="image-input" type="file" accept="image/png,image/jpeg" hidden>
  </main>
  <script type="module" src="./app.js?v=0.15.0"></script>
</body>
</html>
